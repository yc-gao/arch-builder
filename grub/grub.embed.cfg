insmod part_gpt
insmod part_msdos
insmod iso9660

insmod btrfs
insmod ext2
insmod exfat
insmod fat

insmod all_video

if search --set=root --no-floppy --file '/boot/%ARCHISO_UUID%.uuid'; then
    configfile /boot/grub/grub.cfg
else
    echo "Could not find a volume with a '/boot/%ARCHISO_UUID%.uuid' file on it!"
fi