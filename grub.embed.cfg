insmod part_gpt
insmod part_msdos
insmod iso9660

insmod btrfs
insmod ext2
insmod exfat
insmod fat

insmod all_video

if search --set=root --no-floppy --file '/boot/%ARCHISO_UUID%.uuid'; then
    set timeout=5
    menuentry 'Arch Linux' {
        echo    'Loading Linux linux-lts ...'
        linux   /linux/vmlinuz-linux archiso_device=LABEL=%ARCHISO_LABEL% cow_device=LABEL=archiso_cow
        echo    'Loading initial ramdisk ...'
        initrd  /linux/initramfs-linux.img
    }
else
    echo "Could not find a volume with a '/boot/%ARCHISO_UUID%.uuid' file on it!"
fi